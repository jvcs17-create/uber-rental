name: Compilar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Firma fija (misma llave en cada compilacion)
        run: |
          mkdir -p ~/.android
          base64 -d keystore-debug.b64 > ~/.android/debug.keystore

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir el APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: UberRental-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar en Releases (descarga directa)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk --title "Ultima version" --notes "APK mas reciente compilado automaticamente."
